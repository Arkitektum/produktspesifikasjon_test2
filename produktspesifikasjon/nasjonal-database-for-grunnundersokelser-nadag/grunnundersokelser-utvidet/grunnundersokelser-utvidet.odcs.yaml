    description: "Avstanden fra måleutstyret og ned til det punkt på jordoverflaten\
      \ hvor boring/måling faktisk starter<br/>Merknad: Borehullundersøkelsens posisjon\
      \ er vanligvis angitt med x,y,z-koordinat. Disse verdiene representerer vanligvis\
      \ et punkt på jordoverflaten. Dybden fra denne gitte posisjon vil da være 0.\
