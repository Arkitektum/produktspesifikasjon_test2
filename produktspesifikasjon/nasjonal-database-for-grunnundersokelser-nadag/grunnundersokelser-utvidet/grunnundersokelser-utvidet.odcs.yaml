      \ dybdeFraGittPosisjon blir angitt. Denne vil da være avstanden fra måleutstyrets\
      \ senter (0 dybde) og ned til havbunnen, innsjøbunnen eller elvebunnen hvor\
      \ sonderingen/boringen faktisk starter fra).\r\n<br/><engelsk style=\"font-style:italic;font-size:smaller\"\
